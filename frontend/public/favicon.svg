<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="bevel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#000000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Bus Gradients (Terracotta/Red) -->
    <linearGradient id="bus-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="45%" stop-color="#ee1c25" />
      <stop offset="100%" stop-color="#b30006" />
    </linearGradient>

    <linearGradient id="bus-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70d6ff" />
      <stop offset="100%" stop-color="#0084d1" />
    </linearGradient>

    <!-- Metro Gradients (Pink Line) -->
    <linearGradient id="metro-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#e60067" />
      <stop offset="100%" stop-color="#990040" />
    </linearGradient>

    <linearGradient id="metro-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90e0ef" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Track & Metallic Gradients -->
    <linearGradient id="rail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="live-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters for 3D Lighting & Shadows -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <filter id="element-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. BASE SQUIRCLE / 3D APP ICON CONTAINER -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#drop-shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#bevel-grad)" stroke-width="5" />
  
  <!-- Subtle Top Highlight Glare Sheen -->
  <path d="M 40 120 C 40 68 80 40 136 40 L 376 40 C 432 40 472 68 472 120 C 350 145 160 145 40 120 Z" fill="#ffffff" opacity="0.07" />

  <!-- 2. JAIPUR ARCHITECTURAL CROWN / ARCH MOTIF (HERITAGE MEETS MODERN TRANSIT) -->
  <path d="M 180 88 C 180 88 220 54 256 54 C 292 54 332 88 332 88" fill="none" stroke="url(#gold-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.85" />
  <circle cx="256" cy="46" r="4.5" fill="#f59e0b" />

  <!-- 3. LIVE GPS BEACON / SIGNAL RINGS (TOP APEX) -->
  <circle cx="256" cy="118" r="28" fill="none" stroke="#10b981" stroke-width="3" opacity="0.25" />
  <circle cx="256" cy="118" r="18" fill="none" stroke="#10b981" stroke-width="3.5" opacity="0.5" />
  <circle cx="256" cy="118" r="8" fill="url(#live-glow)" filter="url(#element-3d)" />

  <!-- 4. ELEVATED METRO RAIL & HIGHWAY TRACK (DEPTH HORIZON) -->
  <path d="M 70 330 L 442 330" stroke="url(#rail-grad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 96 338 L 416 338" stroke="#1e293b" stroke-width="5" stroke-dasharray="16 12" opacity="0.7" />

  <!-- 5. 3D CITY BUS (LEFT SIDE - JAIPUR BUS 🚌) -->
  <g filter="url(#element-3d)">
    <!-- Bus Main Body with 3D Bevel -->
    <rect x="88" y="160" width="154" height="152" rx="28" fill="url(#bus-body)" />
    <!-- Bus Roof Cap Highlight -->
    <path d="M 104 162 L 226 162 C 236 162 240 166 240 172 L 90 172 C 90 166 94 162 104 162 Z" fill="#ffffff" opacity="0.25" />
    
    <!-- Windshield -->
    <rect x="102" y="178" width="126" height="58" rx="14" fill="url(#bus-glass)" />
    <!-- Windshield Glare Reflection -->
    <path d="M 106 182 L 152 182 L 126 230 L 106 230 Z" fill="#ffffff" opacity="0.32" />
    
    <!-- Destination Sign / LED Box -->
    <rect x="122" y="166" width="86" height="10" rx="3" fill="#0f172a" />
    <circle cx="132" cy="171" r="2" fill="#22c55e" />
    <rect x="140" y="169" width="60" height="4" rx="2" fill="#fbbf24" opacity="0.9" />

    <!-- Bus Front Grille & Air Vent -->
    <rect x="126" y="254" width="78" height="24" rx="7" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <line x1="134" y1="262" x2="196" y2="262" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="134" y1="270" x2="196" y2="270" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Headlights (L & R with 3D Chrome Housing) -->
    <rect x="98" y="252" width="22" height="26" rx="8" fill="#ffffff" filter="url(#inner-shadow)" />
    <circle cx="109" cy="265" r="7" fill="#fef08a" />
    <circle cx="109" cy="265" r="3.5" fill="#ffffff" />

    <rect x="210" y="252" width="22" height="26" rx="8" fill="#ffffff" filter="url(#inner-shadow)" />
    <circle cx="221" cy="265" r="7" fill="#fef08a" />
    <circle cx="221" cy="265" r="3.5" fill="#ffffff" />

    <!-- Wheels (Bottom 3D Tires) -->
    <rect x="100" y="306" width="26" height="12" rx="4" fill="#0f172a" />
    <rect x="204" y="306" width="26" height="12" rx="4" fill="#0f172a" />
  </g>

  <!-- 6. 3D METRO TRAIN (RIGHT SIDE - JAIPUR METRO 🚇) -->
  <g filter="url(#element-3d)">
    <!-- Aerodynamic Metro Cab Body -->
    <path d="M 270 184 C 270 166 288 154 316 154 L 388 154 C 416 154 430 174 430 204 L 430 286 C 430 306 414 312 396 312 L 296 312 C 278 312 270 300 270 284 Z" fill="url(#metro-body)" />
    
    <!-- Top Aerodynamic Highlight -->
    <path d="M 314 156 L 390 156 C 410 156 422 168 424 184 L 284 184 C 286 168 298 156 314 156 Z" fill="#ffffff" opacity="0.28" />

    <!-- Panoramic Streamlined Windshield -->
    <path d="M 284 186 L 416 186 C 420 186 422 192 420 200 L 408 244 C 406 250 398 254 390 254 L 302 254 C 294 254 288 250 286 244 L 280 200 C 278 192 280 186 284 186 Z" fill="url(#metro-glass)" />
    <!-- Windshield High-Speed Glare Line -->
    <path d="M 292 190 L 332 190 L 308 248 L 292 248 Z" fill="#ffffff" opacity="0.32" />

    <!-- Metro Center Line Accent & Nose Badge -->
    <rect x="338" y="262" width="24" height="6" rx="3" fill="#ffffff" />
    <rect x="290" y="272" width="120" height="4" rx="2" fill="#fb7185" opacity="0.8" />

    <!-- Dual High-Intensity Metro LED Headlights -->
    <circle cx="304" cy="286" r="10" fill="#ffffff" />
    <circle cx="304" cy="286" r="6" fill="#38bdf8" />
    <circle cx="304" cy="286" r="3" fill="#ffffff" />

    <circle cx="396" cy="286" r="10" fill="#ffffff" />
    <circle cx="396" cy="286" r="6" fill="#38bdf8" />
    <circle cx="396" cy="286" r="3" fill="#ffffff" />

    <!-- Front Cowl Under-Chassis -->
    <rect x="314" y="308" width="72" height="12" rx="4" fill="#020617" />
  </g>

  <!-- 7. REAL-TIME INTERCONNECTION BEAM (LINKING BUS & METRO LIVE) -->
  <path d="M 230 220 Q 256 200 282 220" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.85" />
  <circle cx="256" cy="210" r="5" fill="#10b981" filter="url(#element-3d)" />

  <!-- 8. UNIFIED "JBL" 3D BRAND MONOGRAM (HIGH CONTRAST & DEPTH) -->
  <g filter="url(#drop-shadow)">
    <!-- Subtle Backplate / Plaque -->
    <rect x="96" y="362" width="320" height="92" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="96" y="362" width="320" height="92" rx="24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.15" />
    
    <!-- "JBL" Main Text - 3D Embossed Style -->
    <text x="256" y="426" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="54" 
          font-weight="900" 
          letter-spacing="5" 
          text-anchor="middle" 
          fill="#ffffff">
      JBL
    </text>
    
    <!-- Subtitle: JAIPUR LIVE TRANSIT -->
    <text x="256" y="446" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" 
          font-weight="800" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="#38bdf8">
      JAIPUR LIVE
    </text>
  </g>
</svg>