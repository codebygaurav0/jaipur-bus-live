<svg width="300" height="170" viewBox="0 0 300 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stopSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="300" height="170" fill="url(#stopSky)" />

  <!-- City Avenue Trees & Architecture -->
  <circle cx="40" cy="90" r="30" fill="#15803d" opacity="0.6" />
  <circle cx="260" cy="95" r="28" fill="#15803d" opacity="0.6" />
  <!-- City Wall in distance -->
  <rect x="0" y="105" width="300" height="15" fill="#fbcfe8" opacity="0.5" />

  <!-- Pavement / Sidewalk -->
  <rect y="120" width="300" height="50" fill="#cbd5e1" />
  <line x1="0" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="2" />
  <line x1="0" y1="145" x2="300" y2="145" stroke="#94a3b8" stroke-width="1" stroke-dasharray="20 20" />

  <!-- Modern Bus Stop Shelter -->
  <!-- Shadow -->
  <rect x="70" y="136" width="160" height="10" rx="5" fill="#0f172a" opacity="0.2" />

  <!-- Support Pillars -->
  <rect x="85" y="55" width="5" height="80" rx="2" fill="#334155" />
  <rect x="210" y="55" width="5" height="80" rx="2" fill="#334155" />

  <!-- Curved Shelter Canopy Roof -->
  <path d="M70 55 C 100 42, 200 42, 230 55 L 226 62 C 196 52, 104 52, 74 62 Z" fill="url(#canopy)" stroke="#0369a1" stroke-width="1.5" />

  <!-- Glass Back Panel -->
  <rect x="85" y="65" width="130" height="55" rx="4" fill="#38bdf8" fill-opacity="0.25" stroke="#bae6fd" stroke-width="1.5" />
  <!-- Glass reflection highlight -->
  <line x1="95" y1="70" x2="140" y2="115" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <line x1="150" y1="70" x2="195" y2="115" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Passenger Bench -->
  <rect x="100" y="112" width="100" height="5" rx="2" fill="#d97706" />
  <rect x="110" y="117" width="4" height="18" fill="#334155" />
  <rect x="186" y="117" width="4" height="18" fill="#334155" />

  <!-- Official JCTSL Bus Stop Signpost -->
  <rect x="240" y="70" width="4" height="65" fill="#475569" />
  <!-- Round Sign Board -->
  <circle cx="242" cy="65" r="14" fill="#e11d48" stroke="#ffffff" stroke-width="2" />
  <!-- Bus icon on sign -->
  <rect x="236" y="59" width="12" height="10" rx="2" fill="#ffffff" />
  <circle cx="238.5" cy="67" r="1.2" fill="#e11d48" />
  <circle cx="245.5" cy="67" r="1.2" fill="#e11d48" />

  <!-- Digital ETA Board on Shelter -->
  <rect x="95" y="68" width="42" height="12" rx="2" fill="#0f172a" />
  <text x="116" y="77" fill="#f59e0b" font-size="6" font-family="monospace" font-weight="bold" text-anchor="middle">ROUTE 6A: 2m</text>
</svg>

