<svg width="520" height="320" viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Terracotta palace gradient -->
    <linearGradient id="hawaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="busBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- HAWA MAHAL ARCHITECTURAL SILHOUETTE IN BACKGROUND -->
  <g opacity="0.85">
    <!-- Pyramid multi-tiered facade -->
    <!-- Tier 5 (Top tier) -->
    <path d="M260 20 Q280 20 290 35 L300 50 H220 L230 35 Q240 20 260 20 Z" fill="#f43f5e" fill-opacity="0.22" />
    <path d="M255 12 q5 -6 10 0 v8 h-10 Z" fill="#e11d48" fill-opacity="0.3" />
    
    <!-- Tier 4 -->
    <path d="M200 50 H320 L330 80 H190 Z" fill="#f43f5e" fill-opacity="0.25" />
    <!-- Jharokha domes Tier 4 -->
    <path d="M205 75 v-15 a5 5 0 0 1 10 0 v15 m15 0 v-15 a5 5 0 0 1 10 0 v15 m15 0 v-15 a5 5 0 0 1 10 0 v15 m15 0 v-15 a5 5 0 0 1 10 0 v15 m15 0 v-15 a5 5 0 0 1 10 0 v15 m15 0 v-15 a5 5 0 0 1 10 0 v15" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

    <!-- Tier 3 -->
    <path d="M170 80 H350 L365 115 H155 Z" fill="#f43f5e" fill-opacity="0.28" />
    <!-- Jharokha domes Tier 3 -->
    <path d="M165 110 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18 m16 0 v-18 a6 6 0 0 1 12 0 v18" stroke="#e11d48" stroke-width="1.6" stroke-opacity="0.4" fill="none" />

    <!-- Tier 2 -->
    <path d="M135 115 H385 L405 155 H115 Z" fill="#f43f5e" fill-opacity="0.3" />
    <path d="M125 150 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22 m18 0 v-22 a7 7 0 0 1 14 0 v22" stroke="#e11d48" stroke-width="1.8" stroke-opacity="0.45" fill="none" />

    <!-- Tier 1 (Base tier) -->
    <rect x="90" y="155" width="340" height="45" fill="#f43f5e" fill-opacity="0.32" />
  </g>

  <!-- Script Callout: Smart Travel for a Smarter Jaipur -->
  <g transform="rotate(-6 130 50)">
    <rect x="40" y="32" width="170" height="28" rx="14" fill="#ffffff" fill-opacity="0.88" />
    <text x="52" y="50" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="14" font-weight="bold" fill="#0f2b48">Smart Travel for a Smarter Jaipur</text>
    <text x="194" y="51" font-size="12" fill="#e11d48">❤️</text>
  </g>

  <!-- Road & Highway -->
  <path d="M0 240 L520 230 L520 320 L0 320 Z" fill="url(#road)" />
  <line x1="20" y1="280" x2="500" y2="275" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="24 16" />

  <!-- MODERN JCTSL LOW-FLOOR CITY BUS (Perspective view) -->
  <!-- Ground Shadow -->
  <ellipse cx="270" cy="272" rx="190" ry="14" fill="#0f172a" opacity="0.35" />

  <!-- Bus Main Chassis/Body -->
  <path d="M70 145 H415 C435 145 448 156 454 175 L456 248 C456 256 448 262 438 262 H78 C68 262 60 254 60 244 V155 C60 149 64 145 70 145 Z" fill="url(#busBodyGrad)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Jaipur Pink Front Fascia & Lower Beltline -->
  <path d="M370 145 H415 C435 145 448 156 454 175 L456 248 C456 256 448 262 438 262 H370 Z" fill="#e11d48" />
  <path d="M60 216 H456 V248 C456 256 448 262 438 262 H78 C68 262 60 254 60 244 Z" fill="#e11d48" />

  <!-- JCTSL Logo Text on Front / Side -->
  <text x="210" y="244" fill="#ffffff" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" letter-spacing="2">JCTSL</text>
  <text x="402" y="240" fill="#ffffff" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" letter-spacing="1">JCTSL</text>

  <!-- LED Destination Display at Front -->
  <rect x="375" y="152" width="65" height="13" rx="3" fill="#0f172a" />
  <text x="407" y="162" fill="#38bdf8" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">JAIPUR</text>

  <!-- Front Windshield -->
  <path d="M375 168 H428 C440 168 448 178 450 196 H375 Z" fill="#0f172a" />
  <path d="M377 170 H425 C435 170 442 178 444 194 H377 Z" fill="#38bdf8" opacity="0.88" />
  <line x1="384" y1="172" x2="430" y2="192" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

  <!-- Passenger Tinted Panoramic Windows -->
  <rect x="76" y="155" width="45" height="48" rx="4" fill="#0f172a" opacity="0.88" />
  <rect x="127" y="155" width="45" height="48" rx="4" fill="#0f172a" opacity="0.88" />
  <rect x="178" y="155" width="45" height="48" rx="4" fill="#0f172a" opacity="0.88" />
  <rect x="229" y="155" width="45" height="48" rx="4" fill="#0f172a" opacity="0.88" />
  <rect x="280" y="155" width="45" height="48" rx="4" fill="#0f172a" opacity="0.88" />
  <rect x="331" y="155" width="38" height="48" rx="4" fill="#0f172a" opacity="0.88" />

  <!-- Doors separator line -->
  <line x1="175" y1="155" x2="175" y2="260" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3" />
  <line x1="277" y1="155" x2="277" y2="260" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Headlights with warm glow -->
  <circle cx="446" cy="225" r="5" fill="#fef08a" />
  <circle cx="446" cy="225" r="9" fill="#fef08a" opacity="0.4" />
  <circle cx="446" cy="225" r="14" fill="#fef08a" opacity="0.15" />

  <!-- Front Grille & License Plate -->
  <rect x="408" y="246" width="22" height="6" rx="1.5" fill="#ffffff" />
  <text x="419" y="251" fill="#0f172a" font-size="4.5" font-family="monospace" font-weight="bold" text-anchor="middle">RJ14</text>

  <!-- Wheels -->
  <!-- Rear Wheels -->
  <circle cx="135" cy="258" r="22" fill="#0f172a" />
  <circle cx="135" cy="258" r="12" fill="#64748b" />
  <circle cx="135" cy="258" r="5" fill="#ffffff" />
  <path d="M107 258 a28 28 0 0 1 56 0" stroke="#0f172a" stroke-width="3" fill="none" />

  <!-- Front Wheel -->
  <circle cx="360" cy="258" r="22" fill="#0f172a" />
  <circle cx="360" cy="258" r="12" fill="#64748b" />
  <circle cx="360" cy="258" r="5" fill="#ffffff" />
  <path d="M332 258 a28 28 0 0 1 56 0" stroke="#0f172a" stroke-width="3" fill="none" />
</svg>

